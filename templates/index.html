<div id="toast" class="fixed top-24 left-1/2 -translate-x-1/2 z-[60] bg-green-600 text-white px-8 py-3 rounded-2xl font-bold shadow-2xl transform transition-all duration-500 opacity-0 translate-y-[-20px] pointer-events-none">
    ✅ Analysis Complete!
</div>

<script>
    let charts = {};

    async function startAnalysis(formData) {
        document.getElementById('upload-section').classList.add('hidden');
        document.getElementById('welcome-text').classList.add('hidden');
        document.getElementById('loading-state').classList.remove('hidden');

        try {
            const response = await fetch('/analyze', { method: 'POST', body: formData });
            const data = await response.json();
            
            if (data.error) throw new Error(data.error);

            // THE POP-UP LOGIC
            document.getElementById('loading-state').classList.add('hidden');
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');

            // Wait 1.5 seconds for the user to see the success message
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-20px]');
                displayResults(data);
            }, 1500);

        } catch (err) {
            alert("Error: " + err.message);
            location.reload();
        }
    }

    function displayResults(data) {
        document.getElementById('results-section').classList.remove('hidden');
        document.getElementById('aiSuggestion').innerText = data.suggestion;

        // RENDER THE DONUT CHARTS
        const statsGrid = document.getElementById('stats-grid');
        statsGrid.innerHTML = ''; // Clear existing

        data.audit.forEach((res, index) => {
            const canvasId = `chart-${index}`;
            statsGrid.innerHTML += `
                <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 flex flex-col items-center">
                    <h4 class="text-xs font-black text-slate-400 uppercase mb-4">${res.theme} Score</h4>
                    <div class="w-32 h-32 mb-4">
                        <canvas id="${canvasId}"></canvas>
                    </div>
                    <span class="text-2xl font-black">${res.score}</span>
                </div>
            `;

            // Wait for DOM update then draw chart
            setTimeout(() => {
                const ctx = document.getElementById(canvasId).getContext('2d');
                const scoreValue = parseInt(res.score);
                const colorMap = { 'SDG': '#eab308', 'IKS': '#a855f7', 'STARTUP': '#ef4444' };
                
                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        datasets: [{
                            data: [scoreValue, 100 - scoreValue],
                            backgroundColor: [colorMap[res.theme.toUpperCase()] || '#6366f1', '#f1f5f9'],
                            borderWidth: 0,
                            borderRadius: 10
                        }]
                    },
                    options: { cutout: '80%', plugins: { tooltip: { enabled: false } } }
                });
            }, 0);
        });

        // (Keep your existing PDF display and evidence list logic below this)
        if (data.pdf_url) {
            document.getElementById('pdfFrame').src = data.pdf_url;
            document.getElementById('downloadBtn').href = data.pdf_url;
        }
        
        // Render Evidence List (Same as before)
        const list = document.getElementById('evidenceList');
        list.innerHTML = `<h3 class="text-xl font-bold text-slate-800 mb-4 px-2">Audit Evidence</h3>`;
        data.audit.forEach(res => {
            const colorMap = { 'SDG': 'yellow-400', 'IKS': 'purple-500', 'STARTUP': 'red-500' };
            const borderCol = colorMap[res.theme.toUpperCase()] || 'indigo-500';
            list.innerHTML += `
                <div class="bg-white p-6 rounded-3xl border-l-8 border-${borderCol} shadow-sm mb-4">
                    <h4 class="font-bold text-slate-900 leading-tight">${res.goal}</h4>
                    <p class="mt-3 text-sm text-slate-500 bg-slate-50 p-3 rounded-xl italic">"${res.evidence}"</p>
                </div>`;
        });
    }
</script>
