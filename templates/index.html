<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Syllabus.AI | National Education Auditor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <nav class="bg-white border-b px-8 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold cursor-pointer" onclick="location.reload()">S</div>
            <h1 class="text-xl font-extrabold tracking-tight text-slate-800">Syllabus.AI</h1>
        </div>
        <button onclick="location.reload()" class="text-xs font-bold text-slate-400 border px-3 py-1 rounded-full uppercase hover:bg-slate-50 transition">Reset Auditor</button>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        <div id="upload-section" class="grid grid-cols-1 md:grid-cols-2 gap-8 mt-10">
            <div class="bg-white border-2 border-dashed border-slate-200 rounded-3xl p-12 text-center hover:border-indigo-400 transition-all cursor-pointer shadow-sm group" onclick="document.getElementById('fileInput').click()">
                <input type="file" id="fileInput" class="hidden" accept=".pdf">
                <div class="text-6xl mb-4">📂</div>
                <h2 class="text-2xl font-bold">Upload PDF</h2>
                <p class="text-slate-500 mt-2">Check NEP Compliance in Documents</p>
            </div>

            <div class="bg-white border border-slate-200 rounded-3xl p-8 shadow-sm flex flex-col">
                <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><span>✍️</span> Paste Text</h2>
                <textarea id="textInput" class="flex-grow p-4 bg-slate-50 rounded-xl border border-slate-100 text-sm focus:ring-2 focus:ring-indigo-500 outline-none min-h-[150px]" placeholder="Paste syllabus content..."></textarea>
                <button onclick="analyzeFromText()" class="mt-4 bg-indigo-600 text-white py-4 rounded-2xl font-bold hover:bg-indigo-700 transition shadow-lg">Analyze Text</button>
            </div>
        </div>

        <div id="results-section" class="hidden space-y-8 mt-10">
            <div class="bg-indigo-50 border border-indigo-100 p-8 rounded-3xl">
                <h3 class="font-black text-indigo-600 uppercase text-xs mb-2">AI Recommendation</h3>
                <p id="aiSuggestion" class="text-indigo-900 font-medium"></p>
            </div>
            
            <div class="text-center">
                <button onclick="location.reload()" class="bg-slate-900 text-white px-10 py-4 rounded-2xl font-bold">Analyze Another Syllabus</button>
            </div>
        </div>
    </main>

    <script>
        // Use your existing JavaScript displayResults logic here...
    </script>
</body>
</html>
