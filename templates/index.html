<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syllabus.AI | National Education Auditor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .hero-gradient { background: radial-gradient(circle at top right, #eef2ff, #ffffff); }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid #e2e8f0; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen hero-gradient">

    <div id="toast" class="fixed top-24 left-1/2 -translate-x-1/2 z-[60] bg-indigo-600 text-white px-8 py-3 rounded-2xl font-bold shadow-2xl transition-all duration-500 opacity-0 translate-y-[-20px] pointer-events-none">
        ✅ Analysis Complete!
    </div>

    <nav class="glass-nav px-6 py-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3" onclick="location.reload()">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold shadow-lg shadow-indigo-100">S</div>
                <h1 class="text-xl font-extrabold tracking-tight">SYLLABUS.AI</h1>
            </div>
            <button onclick="location.reload()" class="bg-white border border-slate-200 text-slate-600 px-4 py-2 rounded-xl text-sm font-bold no-print hover:bg-slate-50 transition">Reset Auditor</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 lg:p-10">
        <div id="upload-section" class="grid grid-cols-1 md:grid-cols-2 gap-8 no-print">
            <div class="bg-white border-2 border-dashed border-slate-200 rounded-[2.5rem] p-12 text-center hover:border-indigo-400 cursor-pointer flex flex-col items-center justify-center" onclick="document.getElementById('fileInput').click()">
                <input type="file" id="fileInput" class="hidden" accept=".pdf">
                <div class="w-16 h-16 bg-indigo-50 rounded-2xl flex items-center justify-center mb-4 text-3xl">📂</div>
                <h3 class="text-2xl font-bold">Upload PDF</h3>
            </div>
            <div class="bg-white border border-slate-100 rounded-[2.5rem] p-8 shadow-sm flex flex-col">
                <textarea id="textInput" class="flex-grow p-5 bg-slate-50 rounded-2xl border-0 outline-none min-h-[200px]" placeholder="Paste syllabus text..."></textarea>
                <button onclick="analyzeFromText()" class="mt-4 bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition">Analyze Text</button>
            </div>
        </div>

        <div id="loading-state" class="hidden py-32 text-center no-print">
            <div class="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <h3 class="text-xl font-bold">Mapping Taxonomy...</h3>
        </div>

        <div id="results-section" class="hidden space-y-10">
            <div id="stats-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>

            <div class="bg-slate-900 text-white p-8 rounded-[2.5rem] shadow-xl flex flex-col md:flex-row gap-6 items-center">
                <div class="text-3xl p-4 bg-white/10 rounded-2xl">💡</div>
                <p id="aiSuggestion" class="text-lg font-medium"></p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div id="evidenceList" class="space-y-4"></div>
                <div id="pdfView" class="bg-white p-4 rounded-[2.5rem] border border-slate-100 h-[650px] no-print">
                    <iframe id="pdfFrame" class="w-full h-full rounded-2xl bg-slate-50"></iframe>
                </div>
            </div>

            <div class="flex justify-center py-10 no-print">
                <button onclick="window.print()" class="bg-indigo-600 text-white px-10 py-4 rounded-2xl font-extrabold shadow-xl hover:scale-105 transition">🖨️ Print Report</button>
            </div>
        </div>
    </main>

    <script>
        // Existing input logic remains...
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);
            startAnalysis(formData);
            e.target.value = '';
        });

        function analyzeFromText() {
            const text = document.getElementById('textInput').value;
            if (!text.trim()) return;
            const formData = new FormData();
            formData.append('text_input', text);
            startAnalysis(formData);
        }

        async function startAnalysis(formData) {
            document.getElementById('upload-section').classList.add('hidden');
            document.getElementById('loading-state').classList.remove('hidden');
            try {
                const response = await fetch('/analyze', { method: 'POST', body: formData });
                const data = await response.json();
                document.getElementById('loading-state').classList.add('hidden');
                displayResults(data);
                const toast = document.getElementById('toast');
                toast.classList.remove('opacity-0', 'translate-y-[-20px]');
                toast.classList.add('opacity-100', 'translate-y-0');
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'translate-y-[-20px]');
                }, 3000);
            } catch (err) { alert("Analysis failed."); location.reload(); }
        }

        function displayResults(data) {
            document.getElementById('results-section').classList.remove('hidden');
            document.getElementById('aiSuggestion').innerText = data.suggestion;
            const statsGrid = document.getElementById('stats-grid');
            statsGrid.innerHTML = '';
            
            const icons = { 'SDG': 'leaf', 'IKS': 'scroll', 'STARTUP': 'rocket' };
            const colors = { 'SDG': '#eab308', 'IKS': '#a855f7', 'STARTUP': '#ef4444' };

            data.audit.forEach((res, i) => {
                const canvasId = `chart-${i}`;
                const iconName = icons[res.theme.toUpperCase()] || 'activity';
                statsGrid.innerHTML += `
                    <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-50 flex flex-col items-center relative overflow-hidden">
                        <div class="absolute -top-4 -right-4 opacity-[0.03] text-slate-900"><i data-lucide="${iconName}" class="w-32 h-32"></i></div>
                        <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">${res.theme} Audit</h4>
                        <div class="w-32 h-32 mb-4"><canvas id="${canvasId}"></canvas></div>
                        <span class="text-3xl font-black">${res.score}</span>
                        <p class="text-[10px] font-bold text-slate-400 mt-2">${res.goal}</p>
                    </div>`;

                setTimeout(() => {
                    const ctx = document.getElementById(canvasId).getContext('2d');
                    new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            datasets: [{
                                data: [parseInt(res.score), 100 - parseInt(res.score)],
                                backgroundColor: [colors[res.theme.toUpperCase()], '#f8fafc'],
                                borderWidth: 0, borderRadius: 20
                            }]
                        },
                        options: { cutout: '85%', plugins: { tooltip: { enabled: false } } }
                    });
                }, 50);
            });
            lucide.createIcons();

            const list = document.getElementById('evidenceList');
            list.innerHTML = `<h3 class="text-xl font-bold mb-4">Taxonomy Evidence</h3>`;
            data.audit.forEach(res => {
                const borderCol = colors[res.theme.toUpperCase()] || '#6366f1';
                list.innerHTML += `
                    <div class="bg-white p-6 rounded-3xl border-l-8 shadow-sm mb-4" style="border-color: ${borderCol}">
                        <h4 class="font-bold text-slate-900">${res.goal}</h4>
                        <p class="mt-3 text-sm text-slate-500 bg-slate-50 p-4 rounded-2xl italic">"${res.evidence}"</p>
                    </div>`;
            });

            if (data.pdf_url) document.getElementById('pdfFrame').src = data.pdf_url;
        }
    </script>
</body>
</html>
