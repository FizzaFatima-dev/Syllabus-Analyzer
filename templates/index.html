<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syllabus.AI | National Education Auditor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        .hero-gradient { background: radial-gradient(circle at top right, #f8faff, #ffffff); }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #eef2f6; }
        .card-hover { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.05); }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="bg-[#fcfdfe] text-slate-900 min-h-screen hero-gradient">

    <div id="toast" class="fixed top-24 left-1/2 -translate-x-1/2 z-[100] bg-emerald-600 text-white px-8 py-3 rounded-2xl font-bold shadow-2xl transition-all duration-500 opacity-0 translate-y-[-20px] pointer-events-none flex items-center gap-3">
        <i data-lucide="check-circle-2"></i> Analysis Complete!
    </div>

    <nav class="glass-nav px-6 py-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold shadow-lg shadow-indigo-100 text-xl">S</div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tighter text-slate-900 uppercase">Syllabus.AI</h1>
                    <p class="text-[9px] font-black text-indigo-600 uppercase tracking-[0.2em] leading-none">NEP 2020 Compliance</p>
                </div>
            </div>
            <button onclick="location.reload()" class="bg-white border border-slate-200 text-slate-600 px-5 py-2 rounded-xl text-sm font-bold no-print hover:bg-slate-50 transition">Reset Auditor</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 lg:p-10">
        <div id="welcome-text" class="text-center mb-16 mt-8 no-print">
            <h2 class="text-5xl font-[900] text-slate-900 mb-6 tracking-tight italic">The Smartest Way to Audit<br><span class="text-indigo-600">Your Curriculum.</span></h2>
            <p class="text-slate-500 max-w-2xl mx-auto text-lg italic">Upload your syllabus PDF to instantly map SDG goals, IKS, and Entrepreneurship modules.</p>
        </div>

        <div id="upload-section" class="grid grid-cols-1 md:grid-cols-2 gap-8 no-print">
            <div class="bg-white border-2 border-dashed border-slate-200 rounded-[2.5rem] p-12 text-center hover:border-indigo-400 cursor-pointer flex flex-col items-center justify-center transition-all group shadow-sm" onclick="document.getElementById('fileInput').click()">
                <input type="file" id="fileInput" class="hidden" accept=".pdf">
                <div class="w-16 h-16 bg-indigo-50 rounded-2xl flex items-center justify-center mb-4 text-3xl">📂</div>
                <h3 class="text-2xl font-extrabold text-slate-800">Upload PDF</h3>
            </div>
            <div class="bg-white border border-slate-100 rounded-[2.5rem] p-10 shadow-sm flex flex-col card-hover">
                <textarea id="textInput" class="flex-grow p-6 bg-slate-50 rounded-2xl border-0 outline-none min-h-[220px] text-slate-600 resize-none" placeholder="Paste syllabus content here..."></textarea>
                <button onclick="analyzeFromText()" class="mt-6 bg-indigo-600 text-white py-4 rounded-2xl font-extrabold shadow-xl hover:bg-indigo-700 transition-all">Start AI Audit</button>
            </div>
        </div>

        <div id="loading-state" class="hidden py-32 text-center no-print">
            <div class="w-16 h-16 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-6"></div>
            <h3 class="text-2xl font-black text-slate-900">AUDITING CURRICULUM...</h3>
        </div>

        <div id="results-section" class="hidden space-y-10">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div id="stats-grid" class="md:col-span-3 grid grid-cols-1 md:grid-cols-3 gap-6"></div>
                <div class="bg-slate-900 text-white p-8 rounded-[2.5rem] shadow-2xl flex flex-col justify-center items-center text-center">
                    <span class="text-[10px] font-black uppercase text-indigo-400 mb-4 tracking-widest">Taxonomy Rank</span>
                    <h2 id="bloomLevel" class="text-3xl font-black mb-2 tracking-tighter">--</h2>
                    <p id="obeStatus" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Compliance Status</p>
                </div>
            </div>

            <div class="bg-white p-10 rounded-[3rem] border border-slate-100 shadow-sm">
                <h3 class="text-2xl font-black mb-8 flex items-center gap-3 uppercase tracking-tighter italic">
                    <i data-lucide="layout-grid" class="text-indigo-600"></i> SDG Heatmap
                </h3>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <tbody id="heatmapBody" class="text-sm"></tbody>
                    </table>
                </div>
            </div>

            <div class="bg-indigo-600 text-white p-10 rounded-[3rem] shadow-2xl flex flex-col md:flex-row gap-8 items-center">
                <div class="text-5xl bg-white/10 p-6 rounded-[2rem]">💡</div>
                <p id="aiSuggestion" class="text-xl font-semibold leading-relaxed"></p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                <div id="evidenceList" class="space-y-4"></div>
                <div id="pdfView" class="bg-white p-5 rounded-[3rem] border border-slate-100 h-[700px] no-print">
                    <iframe id="pdfFrame" class="w-full h-full rounded-[2rem] border-0 bg-slate-50"></iframe>
                </div>
            </div>
            
            <div class="flex justify-center py-10 no-print">
                <button onclick="window.print()" class="bg-slate-900 text-white px-14 py-6 rounded-[2rem] font-[900] shadow-2xl hover:scale-105 transition-all">🖨️ PRINT AUDIT REPORT</button>
            </div>
        </div>
    </main>

    <script>
        const iconConfig = { 'SDG': 'leaf', 'IKS': 'scroll', 'STARTUP': 'rocket' };
        const colors = { 'SDG': '#10b981', 'IKS': '#a855f7', 'STARTUP': '#f43f5e' };

        async function startAnalysis(formData) {
            document.getElementById('upload-section').classList.add('hidden');
            document.getElementById('welcome-text').classList.add('hidden');
            document.getElementById('loading-state').classList.remove('hidden');
            try {
                const response = await fetch('/analyze', { method: 'POST', body: formData });
                const data = await response.json();
                document.getElementById('loading-state').classList.add('hidden');
                displayResults(data);
                const toast = document.getElementById('toast');
                toast.classList.add('opacity-100', 'translate-y-0');
                setTimeout(() => toast.classList.remove('opacity-100'), 3500);
            } catch (err) { alert("Error: " + err.message); location.reload(); }
        }

        function displayResults(data) {
            document.getElementById('results-section').classList.remove('hidden');
            document.getElementById('aiSuggestion').innerText = data.suggestion ?? "No recommendation available.";
            document.getElementById('bloomLevel').innerText = data.taxonomy?.bloom_level ?? "L4 - Analyze";
            document.getElementById('obeStatus').innerText = data.taxonomy?.obe_status ?? "Highly Compliant";

            const statsGrid = document.getElementById('stats-grid');
            statsGrid.innerHTML = '';
            (data.audit || []).forEach((res, i) => {
                const canvasId = `chart-${i}`;
                const icon = iconConfig[res.theme.toUpperCase()] || 'activity';
                statsGrid.innerHTML += `
                    <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-50 flex flex-col items-center relative overflow-hidden card-hover">
                        <div class="absolute -top-6 -right-6 opacity-[0.03] text-slate-900 rotate-12"><i data-lucide="${icon}" class="w-40 h-40"></i></div>
                        <h4 class="text-[10px] font-black text-slate-300 uppercase tracking-widest mb-6">${res.theme} Score</h4>
                        <div class="w-32 h-32 mb-6"><canvas id="${canvasId}"></canvas></div>
                        <span class="text-4xl font-black">${res.score}</span>
                    </div>`;
                setTimeout(() => {
                    const ctx = document.getElementById(canvasId).getContext('2d');
                    new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            datasets: [{
                                data: [parseInt(res.score), 100 - parseInt(res.score)],
                                backgroundColor: [colors[res.theme.toUpperCase()] || '#6366f1', '#f8fafc'],
                                borderWidth: 0, borderRadius: 20
                            }]
                        },
                        options: { cutout: '85%', plugins: { tooltip: { enabled: false } } }
                    });
                }, 100);
            });

            const heatBody = document.getElementById('heatmapBody');
            heatBody.innerHTML = '';
            (data.heatmap || []).forEach(row => {
                heatBody.innerHTML += `<tr class="border-b border-slate-50 group hover:bg-slate-50/50 transition-colors">
                    <td class="py-5 font-extrabold text-slate-700">${row.dept}</td>
                    <td class="py-5"><div class="w-32 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                    <div class="bg-indigo-500 h-full rounded-full" style="width: 75%"></div></div></td>
                    <td class="py-5"><span class="bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full text-[10px] font-black">SDG ${row.sdg}</span></td>
                    <td class="py-5 text-right font-black text-[10px] text-emerald-500">MAPPED ✅</td></tr>`;
            });

            const list = document.getElementById('evidenceList');
            list.innerHTML = `<h3 class="text-xl font-black mb-6 uppercase tracking-tighter">Audit Evidence</h3>`;
            (data.audit || []).forEach(res => {
                list.innerHTML += `<div class="bg-white p-8 rounded-[2.5rem] border-l-[10px] shadow-sm mb-4" style="border-color: ${colors[res.theme.toUpperCase()]}">
                    <h4 class="font-extrabold text-slate-900 text-lg mb-4">${res.goal}</h4>
                    <p class="text-sm text-slate-500 bg-slate-50 p-5 rounded-2xl italic border border-slate-100">"${res.evidence}"</p>
                </div>`;
            });

            if (data.pdf_url) document.getElementById('pdfFrame').src = data.pdf_url;
            lucide.createIcons();
        }

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const formData = new FormData();
            formData.append('file', e.target.files[0]);
            startAnalysis(formData);
        });

        function analyzeFromText() {
            const formData = new FormData();
            formData.append('text_input', document.getElementById('textInput').value);
            startAnalysis(formData);
        }
    </script>
</body>
</html>
